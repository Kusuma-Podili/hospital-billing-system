[tool.poetry]
name = "hospital-billing-system"
version = "1.0.0"
description = "Enterprise Hospital Billing & Revenue Cycle Management (RCM) System"
authors = ["Kusuma Podili <podilikusuma15@gmail.com>"]
readme = "README.md"
packages = [{include = "medbill"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
jinja2 = "^3.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
